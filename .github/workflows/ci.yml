name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check manifest and locales
        run: node scripts/check-manifest.mjs
      - name: Syntax check
        run: for f in *.js scripts/*.mjs; do node --check "$f"; done
      - name: Test
        run: node --test tests/*.mjs
